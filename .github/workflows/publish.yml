name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # nötig für OIDC / Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest   # GitHub-hosted Runner, kein Self-hosted
    # environment: release   # nur setzen, wenn du bei npm einen Environment-Namen eingetragen hast
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # in Release-Builds kein Cache

      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test --if-present

      - run: npm publish --provenance   # OIDC-Attestat, wird von npmjs für Trusted Publishing verlangt
